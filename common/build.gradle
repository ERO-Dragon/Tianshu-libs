plugins {
    id 'java-library'
}

def libsDir = rootProject.layout.projectDirectory.dir('libs')
def jjmlJar = libsDir.file("org.argeo.jjml-${jjml_version}.jar")
def sherpaJar = libsDir.file("sherpa-onnx-v${sherpa_onnx_version}.jar")
def sherpaNativeJar = libsDir.file("sherpa-onnx-native-lib-win-x64-v${sherpa_onnx_version}.jar")

configurations {
    externalNativeManifest
}

dependencies {
    api files(jjmlJar)
    api files(sherpaJar)
    api files(sherpaNativeJar)
    api "com.microsoft.onnxruntime:onnxruntime:${onnxruntime_version}"
    api "io.github.eix128:sentencepiece4j:${sentencepiece4j_version}"
    api "com.google.protobuf:protobuf-java:${protobuf_version}"
    api "com.belerweb:pinyin4j:${pinyin4j_version}"

    compileOnly "org.apache.commons:commons-compress:${commons_compress_version}"
    compileOnly "it.unimi.dsi:fastutil:${fastutil_version}"
    compileOnly "com.google.code.gson:gson:${gson_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"

    externalNativeManifest files(sherpaJar)
    externalNativeManifest files(sherpaNativeJar)
    externalNativeManifest "com.microsoft.onnxruntime:onnxruntime:${onnxruntime_version}"
}

