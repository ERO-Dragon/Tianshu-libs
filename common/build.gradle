    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rheinmetal.tianshu.libs.llm.ManualLatencyBenchmark'
    systemProperty 'tianshu.llm.model', System.getProperty(
            'tianshu.llm.model',
            'D:\\Minecraft\\Qwen3.5-9B-DeepSeek-V4-Flash-Q4_K_M.gguf'
