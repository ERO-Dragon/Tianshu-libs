            'tianshu.llm.model',
            'D:\\Minecraft\\.minecraft\\versions\\Tianshu\\config\\TianshuAIAssistant\\models\\llm\\Qwen3-4B\\Qwen3-4B-Q4_K_M.gguf'
    )
