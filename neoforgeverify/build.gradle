plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-verify"
}

def verifyJavaVersion = providers.gradleProperty('neoforge_verify_java_version')
        .map { it as Integer }
        .orElse(21)

java {
    toolchain.languageVersion = verifyJavaVersion.map { JavaLanguageVersion.of(it) }
    sourceCompatibility = verifyJavaVersion.map { JavaVersion.toVersion(it) }.get()
    targetCompatibility = verifyJavaVersion.map { JavaVersion.toVersion(it) }.get()
}

tasks.withType(JavaCompile).configureEach {
    options.release = verifyJavaVersion
}

neoForge {
    def verifyNeoForgeVersion = providers.gradleProperty('neoforge_verify_version')
            .orElse(providers.gradleProperty('neoforge_version'))
            .orElse(providers.gradleProperty('neoforge_dev_version'))
    version = verifyNeoForgeVersion.get()

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def neoForgeCoordinate = providers.gradleProperty('neoforge_verify_version')
        .orElse(providers.gradleProperty('neoforge_version'))
        .orElse(providers.gradleProperty('neoforge_dev_version'))
def defaultCompatTarget = neoForgeCoordinate.map { coordinate ->
    "neoforge-${coordinate.substring(0, coordinate.lastIndexOf('.'))}"
}
def compatTarget = providers.gradleProperty('compat_target').orElse(defaultCompatTarget)
def stagedModsDir = compatTarget.map { target -> rootProject.layout.buildDirectory.dir("compat/${target}/mods").get() }

def installStagedMods = tasks.register('installStagedNeoForgeMods', Sync) {
    dependsOn rootProject.tasks.named('stageCompatMatrix')
    from stagedModsDir
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') {
    dependsOn installStagedMods
}

tasks.register('verifyNeoForgeClient') {
    group = 'verification'
    description = 'Starts a NeoForge client with the staged universal jar installed.'
    dependsOn tasks.named('runClient')
}
