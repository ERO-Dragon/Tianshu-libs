plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '9.3.1' apply false
}

import com.rheinmetal.compat.CompatMatrixTask
import groovy.json.JsonSlurper

allprojects {
    version = mod_version
    group = mod_group_id

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 17
        }
    }
}

evaluationDependsOn(':common')
evaluationDependsOn(':fabric')
evaluationDependsOn(':neoforge')

def universalJarTask = tasks.register('universalJar', Zip) {
    group = 'build'
    description = 'Builds a single jar that can be discovered by both Fabric and NeoForge.'

    archiveFileName = "${mod_id}-${mod_version}-universal.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def neoForgeShadowJar = project(':neoforge').tasks.named('shadowJar')
    dependsOn neoForgeShadowJar
    from({ zipTree(neoForgeShadowJar.get().archiveFile.get().asFile) })

    dependsOn project(':fabric').tasks.named('classes')
    from(project(':fabric').sourceSets.main.output)

    from('neoforge/src/main/templates/META-INF/mods.toml') {
        into 'META-INF'
        expand([
                minecraft_version                  : minecraft_version,
                minecraft_version_range            : minecraft_version_range,
                neo_version                        : providers.gradleProperty('neoforge_version')
                        .orElse(providers.gradleProperty('neoforge_dev_version'))
                        .get(),
                neo_version_range                  : neo_version_range,
                forge_legacy_version_range         : forge_legacy_version_range,
                forge_legacy_minecraft_version_range: forge_legacy_minecraft_version_range,
                loader_version_range               : loader_version_range,
                mod_id                             : mod_id,
                mod_name                           : mod_name,
                mod_license                        : mod_license,
                mod_version                        : mod_version,
        ])
    }
}

def universalJarArchive = universalJarTask.flatMap { it.archiveFile }

def compatMatrixFile = layout.projectDirectory.file('compat/matrix.json')
def compatTargets = providers.fileContents(compatMatrixFile).asText.map { text ->
    def matrix = new JsonSlurper().parseText(text)
    matrix.targets.collectEntries { target, spec ->
        def resolvedSpec = new LinkedHashMap(spec)
        if (resolvedSpec.loaderVersion == null && resolvedSpec.status != 'blocked') {
            throw new GradleException("compat target '${target}' must define loaderVersion")
        }
        [(target): resolvedSpec]
    }
}

def compatTargetDescriptors = compatTargets.map { targets ->
    targets.collectEntries { target, spec ->
        def descriptor = groovy.json.JsonOutput.toJson([
                loader        : spec.loader,
                minecraft     : spec.minecraft,
                loaderVersion : spec.loaderVersion,
                java          : spec.java,
                status        : spec.status,
                requiredEntries: spec.requiredEntries,
        ])
        [(target): descriptor]
    }
}

def compatRequiredEntries = compatTargets.map { targets ->
    targets.collectEntries { target, spec ->
        [(target): spec.requiredEntries]
    }
}

tasks.register('stageCompatMatrix', CompatMatrixTask) {
    group = 'verification'
    description = 'Stages the universal jar into lightweight per-loader compatibility directories.'

    dependsOn universalJarTask
    universalJar.set(universalJarArchive)
    targets.set(compatTargets.map { it.keySet().toList() })
    targetDescriptors.set(compatTargetDescriptors)
    requiredEntries.set(compatRequiredEntries)
    stagingDirectory.set(layout.buildDirectory.dir('compat'))
}

tasks.register('verifyCompatMatrix') {
    group = 'verification'
    description = 'Verifies and stages the compatibility matrix without duplicating full Minecraft installations.'

    dependsOn tasks.named('stageCompatMatrix')
}

tasks.register('validateUniversalNativeRuntime') {
    group = 'verification'
    description = 'Verifies the universal jar uses Sherpa ONNX Runtime native binaries.'

    dependsOn universalJarTask
    inputs.file universalJarArchive

    doLast {
        def forbiddenOrtRuntime = 'ai/onnxruntime/native/win-x64/onnxruntime.dll'
        def requiredSherpaRuntime = 'sherpa-onnx/native/win-x64/onnxruntime.dll'
        def requiredManifestEntries = [
                'ai/onnxruntime/native/win-x64/onnxruntime4j_jni.dll',
                'ai/onnxruntime/native/win-x64/onnxruntime_providers_shared.dll',
                requiredSherpaRuntime,
                'sherpa-onnx/native/win-x64/sherpa-onnx-jni.dll',
        ] as Set

        def jarFile = universalJarArchive.get().asFile
        def entries = [] as Set
        def manifestEntries = [] as Set
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            zip.entries().each { entry ->
                if (!entry.directory) entries << entry.name
            }

            def manifest = zip.getEntry('META-INF/native-libs.txt')
            if (manifest == null) {
                throw new GradleException("${jarFile.name} is missing META-INF/native-libs.txt")
            }
            manifestEntries.addAll(zip.getInputStream(manifest).getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') })
        } finally {
            zip.close()
        }

        if (entries.contains(forbiddenOrtRuntime)) {
            throw new GradleException("${jarFile.name} must not include ${forbiddenOrtRuntime}; use Sherpa's ONNX Runtime DLL instead.")
        }
        if (manifestEntries.contains(forbiddenOrtRuntime)) {
            throw new GradleException("META-INF/native-libs.txt must not include ${forbiddenOrtRuntime}; use Sherpa's ONNX Runtime DLL instead.")
        }
        if (!entries.contains(requiredSherpaRuntime)) {
            throw new GradleException("${jarFile.name} is missing ${requiredSherpaRuntime}")
        }

        def missingManifestEntries = requiredManifestEntries.findAll { !manifestEntries.contains(it) }
        if (!missingManifestEntries.isEmpty()) {
            throw new GradleException("META-INF/native-libs.txt is missing native entries: ${missingManifestEntries.join(', ')}")
        }
    }
}

universalJarTask.configure {
    finalizedBy tasks.named('validateUniversalNativeRuntime')
}

tasks.named('build') {
    dependsOn tasks.named('validateUniversalNativeRuntime')
    if (providers.gradleProperty('includeVerifyProjects').map { it.toBoolean() }.orElse(false).get()) {
        dependsOn tasks.named('verifyCompatMatrix')
    }
}
