plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = "${mod_id}-forge-verify"
}

def verifyJavaVersion = providers.gradleProperty('forge_verify_java_version')
        .map { it as Integer }
        .orElse(21)

java {
    toolchain.languageVersion = verifyJavaVersion.map { JavaLanguageVersion.of(it) }
    sourceCompatibility = verifyJavaVersion.map { JavaVersion.toVersion(it) }.get()
    targetCompatibility = verifyJavaVersion.map { JavaVersion.toVersion(it) }.get()
}

tasks.withType(JavaCompile).configureEach {
    options.release = verifyJavaVersion
}

legacyForge {
    def verifyForgeVersion = providers.gradleProperty('forge_verify_version')
            .orElse(providers.gradleProperty('forge_version'))
            .orElse(providers.gradleProperty('forge_dev_version'))
    version = verifyForgeVersion.get()

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def forgeCoordinate = providers.gradleProperty('forge_verify_version')
        .orElse(providers.gradleProperty('forge_version'))
        .orElse(providers.gradleProperty('forge_dev_version'))
def defaultCompatTarget = forgeCoordinate.map { coordinate ->
    "forge-${coordinate.substring(0, coordinate.lastIndexOf('-'))}"
}
def compatTarget = providers.gradleProperty('compat_target').orElse(defaultCompatTarget)
def stagedModsDir = compatTarget.map { target -> rootProject.layout.buildDirectory.dir("compat/${target}/mods").get() }

def installStagedMods = tasks.register('installStagedForgeMods', Sync) {
    dependsOn rootProject.tasks.named('stageCompatMatrix')
    from stagedModsDir
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') {
    dependsOn installStagedMods
}

tasks.register('verifyForgeClient') {
    group = 'verification'
    description = 'Starts a Forge client with the staged universal jar installed.'
    dependsOn tasks.named('runClient')
}
