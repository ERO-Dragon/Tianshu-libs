modLoader="javafml"
loaderVersion="${forge_legacy_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Native AI inference library for Tianshu mod.
Bundles llama.cpp (jjml), ONNX Runtime, Sherpa-ONNX, and SentencePiece.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_legacy_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_legacy_minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
